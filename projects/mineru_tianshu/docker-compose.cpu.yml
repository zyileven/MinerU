version: '3.8'

services:
  mineru-tianshu:
    image: mineru-tianshu:latest
    container_name: mineru-tianshu
    build:
      context: .
      dockerfile: Dockerfile.tianshu.cpu
    ports:
      - "8100:8100"  # API Server
      - "9100:9100"  # Worker Server
    volumes:
      # 输出文件持久化
      - ${DATA_DIR:-~/mineru}/output:/data/output
      # 上传文件持久化
      - ${DATA_DIR:-~/mineru}/uploads:/data/uploads
      # 临时文件持久化(确保跨容器访问)
      - ${DATA_DIR:-~/mineru}/tmp:/tmp
      # 静态文件持久化(本地图片存储)
      - ./static_files:/app/static:rw
    environment:
      # MinerU 配置
      - MINERU_MODEL_SOURCE=local
      # PDF 转图片超时时间(秒) - 默认 300s(5分钟), 设置为 1800s(30分钟)
      - MINERU_PDF_RENDER_TIMEOUT=1800
      # API 配置
      - API_PORT=8100

      - USE_MINIO=false
      # 服务器基础 URL - 部署时需要修改为服务器实际地址
      # 本地测试: http://localhost:8100
      # 服务器部署: http://your-server-ip:8100 或 http://your-domain:8100
      - SERVER_BASE_URL=${SERVER_BASE_URL:-http://localhost:8100}
    command: >
      python start_all.py
      --accelerator cpu
      --api-port 8100
      --worker-port 9100
      --output-dir /data/output
      --workers-per-device ${WORKERS_PER_DEVICE:-2}
    restart: unless-stopped
    networks:
      - mineru-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # CPU 资源限制(可选,防止占用过多资源)
    # 当前配置: 本地测试环境资源限制
    deploy:
      resources:
        limits:
          cpus: '8'      # 本地测试: 最多使用 8 个 CPU 核心
          memory: 16G    # 本地测试: 最多使用 16GB 内存
        reservations:
          cpus: '2'      # 本地测试: 预留 2 个 CPU 核心
          memory: 4G     # 本地测试: 预留 4GB 内存
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Docker 网络
networks:
  mineru-network:
    driver: bridge

# 持久化卷
volumes:
  mineru-output:
